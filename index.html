<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pack Invaders</title>
  <link rel="preload" href="./fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Game fonts: VT323 (readable pixel terminal) for body text and
       Press Start 2P (chunky arcade) for titles — both self-hosted */
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/vt323-latin-400-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2212;
    }
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/vt323-latin-ext-400-normal.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0;
    }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/press-start-2p-latin-400-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2212;
    }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/press-start-2p-latin-ext-400-normal.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { display: flex; justify-content: center; align-items: center; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain; /* keep 16:9, letterbox on portrait phones */
      image-rendering: pixelated;
      touch-action: none;  /* no browser pan/zoom gestures over the game */
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
