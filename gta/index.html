<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilha Paulista-Carioca</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Trebuchet MS', sans-serif; }
    #hud-zone {
      position: fixed; top: 18px; left: 22px; color: #fff;
      font-size: 30px; font-weight: bold; letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 3px 3px 8px rgba(0,0,0,.6);
      font-style: italic; pointer-events: none;
    }
    #hud-region {
      position: fixed; top: 54px; left: 24px; color: #ffd24a;
      font-size: 15px; font-weight: bold; text-shadow: 1px 1px 0 #000;
      pointer-events: none;
    }
    #minimap {
      position: fixed; top: 16px; right: 16px; width: 200px; height: 200px;
      border: 3px solid #111; border-radius: 6px; box-shadow: 0 0 0 2px #f5d76e;
      pointer-events: none;
    }
    #prompt {
      position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 19px; font-weight: bold; letter-spacing: .5px;
      text-shadow: 2px 2px 0 #000; pointer-events: none;
    }
    #help {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: #eee; font-size: 13px; background: rgba(0,0,0,.45);
      padding: 6px 14px; border-radius: 6px; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="hud-zone"></div>
  <div id="hud-region"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="prompt"></div>
  <div id="help">WASD mover &nbsp;·&nbsp; Shift correr &nbsp;·&nbsp; E entrar/sair &nbsp;·&nbsp; Mouse (clique) câmera &nbsp;·&nbsp; Scroll zoom</div>
  <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
  <script type="module" src="./main.js"></script>
</body>
</html>
