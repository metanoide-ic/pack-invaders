name: Publicar Plataforma Origem

on:
  push:
    branches:
      - main
      - claude/plataforma-origem-site-app-52kx29
    paths:
      - 'plataforma-origem/**'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-platform
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plataforma-origem/package-lock.json

      - name: Instalar dependências
        working-directory: plataforma-origem
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build de produção
        working-directory: plataforma-origem
        run: npm run build

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: plataforma-origem/dist
          commit_message: 'Deploy da Plataforma Origem'
